spring.application.name=SigmaZero

# PostgreSQL DataSource Settings
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sigmazero_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=SigmaZeroHikariPool

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT - override SIGMAZERO_JWT_SECRET in production
sigmazero.jwt.secret=${SIGMAZERO_JWT_SECRET}
sigmazero.jwt.expiration-ms=${SIGMAZERO_JWT_EXPIRATION_MS:86400000}
